# Local development stack: FastAPI backend + Vite frontend, both with hot reload.
#
#   docker compose up --build        # start everything
#   docker compose down              # stop
#
# Frontend: http://localhost:5173    API: http://localhost:8000 (docs at /docs)

services:
  backend:
    build:
      context: ./backend
      target: dev
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    # Optional: a fresh clone still starts without backend/.env (the app runs;
    # only the CFBD ingest scripts need the key).
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # If --reload misses edits (project on a Windows drive, or WSL2 with files
      # outside the Linux filesystem), uncomment this:
      # WATCHFILES_FORCE_POLLING: "true"
      ODDS_RATE_LIMIT_PER_MINUTE: "60"
    volumes:
      # Source and cfbrank.db live on your machine: edits reload the server, and
      # the SQLite file is the same one you'd use running outside Docker.
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      # The browser (not the container) calls the API, so this is the host-side URL.
      VITE_API_BASE_URL: http://localhost:8000
      # If HMR misses edits on a Windows drive, also set a polling watcher in
      # vite.config.js:  server: { watch: { usePolling: true } }
    volumes:
      - ./frontend:/app
      # Keep the container's node_modules; don't let the host folder hide it.
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  frontend_node_modules:
